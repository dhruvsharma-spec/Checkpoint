# MONGODB SERVERS
#
# Used by the Database CCB: when MongoDB is chosen, the form offers a cluster, then a role within it, then the
# IPs. A person can also type an IP that is not listed.
#
# type is Replica or Sharded. role is free text, for example Primary, Secondary, Arbiter, Router, Config Primary,
# Shard 1 Primary. managed_by says what runs the routers (optional).
#
# To change it: edit this file, then run ./scripts/minikube.sh apply
# Built from the "MongoDB Inventory - NOC" sheet.

clusters:
  - name: "Bridge Prod"
    type: "Replica"
    servers:
      - { ip: "10.85.1.6", role: "Primary" }
      - { ip: "10.85.0.14", role: "Secondary" }
      - { ip: "10.85.1.144", role: "Secondary" }
