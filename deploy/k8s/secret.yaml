# LOCAL-ONLY credentials for minikube. Do not reuse these anywhere else.
# Real environments must inject secrets from Vault or another secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: checkpoint-secrets
  namespace: checkpoint
type: Opaque
stringData:
  MYSQL_PASSWORD: "checkpoint-local-pw"
  MYSQL_ROOT_PASSWORD: "checkpoint-local-root-pw"
  DATABASE_URL: "mysql://checkpoint:checkpoint-local-pw@checkpoint-db:3306/checkpoint"
  SESSION_SECRET: "local-minikube-session-secret-change-me-0123456789"
