# MySQL 8.4 runs as its own service, separate from the backend and frontend. Its data lives on a PersistentVolumeClaim
# (created from volumeClaimTemplates below as "data-checkpoint-db-0"), so it survives pod restarts, re-deploys and
# "minikube stop". There are no backups in this local setup; the Helm chart (deploy/helm) adds them for EKS.
# The claim is only removed by "./scripts/minikube.sh reset".
apiVersion: v1
kind: Service
metadata:
  name: checkpoint-db
  namespace: checkpoint
  labels: { app: checkpoint-db }
spec:
  clusterIP: None
  selector: { app: checkpoint-db }
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checkpoint-db
  namespace: checkpoint
spec:
  serviceName: checkpoint-db
  replicas: 1
  # Keep the claim (and the data) even if this StatefulSet is deleted or scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: { app: checkpoint-db }
  template:
    metadata:
      labels: { app: checkpoint-db }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: { fsGroup: 999 }
      initContainers:
        # MySQL refuses to start unless its data directory is empty. The volume's root can hold files that are not
        # MySQL's: lost+found on a freshly formatted EBS volume, or leftovers from an earlier deployment on minikube.
        # So the database lives in a sub-folder, which this step creates and hands to the mysql user.
        - name: datadir
          image: mysql:8.4
          command: ["sh", "-c", "mkdir -p /var/lib/mysql/data"]
          securityContext: { runAsNonRoot: true, runAsUser: 999, allowPrivilegeEscalation: false }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--datadir=/var/lib/mysql/data", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - { name: MYSQL_DATABASE, value: checkpoint }
            - { name: MYSQL_USER, value: checkpoint }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: checkpoint-secrets, key: MYSQL_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: checkpoint-secrets, key: MYSQL_ROOT_PASSWORD } }
          readinessProbe:
            exec: { command: ["sh", "-c", "mysql -ucheckpoint -p\"$MYSQL_PASSWORD\" -e 'select 1' checkpoint"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"] }
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
