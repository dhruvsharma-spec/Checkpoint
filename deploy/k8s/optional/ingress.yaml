# Optional. Use this instead of port-forward if you prefer http://checkpoint.local
#   minikube addons enable ingress
#   kubectl apply -f deploy/k8s/optional/ingress.yaml
#   echo "$(minikube ip) checkpoint.local" | sudo tee -a /etc/hosts      (on macOS with the docker driver run "minikube tunnel" and use 127.0.0.1)
# Also set WEB_URL to http://checkpoint.local in configmap.yaml and re-apply, and add that address to the Google redirect URIs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkpoint
  namespace: checkpoint
spec:
  ingressClassName: nginx
  rules:
    - host: checkpoint.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: checkpoint-frontend, port: { number: 3000 } }
