# Staging: namespace devx-stg.
webUrl: https://checkpoint-stg.example.com
app:
  seedSamples: "false"
  bootstrapAdmins: "dhruv.sharma@lenskart.com"
backend:
  replicas: 1
  autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3, cpu: 70 }
frontend:
  replicas: 1
  autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3, cpu: 70 }
ingress:
  host: checkpoint-stg.example.com
mysql:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  bufferPoolSize: 256M
  storage: { size: 10Gi, iops: "3000", throughput: "125" }
backup:
  schedule: "30 20 * * *"
  bucket: ""
