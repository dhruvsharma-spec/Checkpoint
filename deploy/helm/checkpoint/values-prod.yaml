# Production: namespace devx-prod.
# Run only on the devx Karpenter pool (deploy/karpenter/devx-nodepool.yaml): on-demand, and tainted so that nothing
# else in the cluster is scheduled onto these nodes. The selector keeps us off everyone else's nodes.
nodeSelector: { karpenter.sh/nodepool: devx }
tolerations:
  - { key: workload, operator: Equal, value: devx, effect: NoSchedule }

app:
  env: production          # Google sign-in only; the chart refuses app.env=local in devx-prod
  devLogin: "false"

webUrl: https://checkpoint.example.com
backend:
  replicas: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8, cpu: 70 }
frontend:
  replicas: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, cpu: 70 }
ingress:
  host: checkpoint.example.com
mysql:
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 3Gi }
  bufferPoolSize: 1G
  storage: { size: 50Gi, iops: "3000", throughput: "125" }
backup:
  schedule: "30 */6 * * *"     # every 6 hours
  bucket: ""
